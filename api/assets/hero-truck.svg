<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 520"
  preserveAspectRatio="xMidYMid slice"
>

  <defs>

    <linearGradient
      id="sky"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >

      <stop
        offset="0"
        stop-color="#07172b"
      />

      <stop
        offset=".55"
        stop-color="#143a58"
      />

      <stop
        offset="1"
        stop-color="#f29b5b"
      />

    </linearGradient>


    <linearGradient
      id="road"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >

      <stop
        offset="0"
        stop-color="#1b2b3d"
      />

      <stop
        offset="1"
        stop-color="#050a11"
      />

    </linearGradient>


    <linearGradient
      id="truck"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >

      <stop
        offset="0"
        stop-color="#39c6ff"
      />

      <stop
        offset=".55"
        stop-color="#1677c8"
      />

      <stop
        offset="1"
        stop-color="#0b3d6b"
      />

    </linearGradient>


    <linearGradient
      id="light"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        offset="0"
        stop-color="#fff3b0"
        stop-opacity=".95"
      />

      <stop
        offset="1"
        stop-color="#ffc857"
        stop-opacity="0"
      />

    </linearGradient>


    <filter id="blur">

      <feGaussianBlur
        stdDeviation="14"
      />

    </filter>

  </defs>


  <!-- CIELO -->

  <rect
    width="1400"
    height="520"
    fill="url(#sky)"
  />


  <!-- SOL -->

  <circle
