<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  >

  <title>ECUASERVER +593 | Página no encontrada</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #4ea8df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        linear-gradient(
          180deg,
          #0f172a 0%,
          #172033 100%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;

      padding: 36px 28px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 18px;
    }

    .truck {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;

      font-size: 30px;
    }

    p {
      margin: 14px 0 26px;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.5;
    }

    a {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 52px;

      padding: 0 22px;

      border-radius: 11px;

      background: var(--accent);

      color: #07111c;

      text-decoration: none;

      font-weight: 700;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="truck">
      🚛
    </div>

    <h1>
      Página no encontrada
    </h1>

    <p>
      La ruta que buscas no existe o ya no está disponible.
    </p>

    <a href="/">
      Volver al servidor
    </a>

  </main>

</body>
</html>
