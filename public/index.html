<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECUASERVER +593 | Estado del Servidor</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-online: #10b981;
      --accent-offline: #ef4444;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .dashboard { width: 100%; max-width: 550px; background-color: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); overflow: hidden; }
    .header { padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .header-title h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
    .header-title p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .status-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; background-color: rgba(16, 185, 129, 0.1); color: var(--accent-online); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-badge.offline { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-offline); border-color: rgba(239, 68, 68, 0.2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }
    .content { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .card { background-color: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
    .card-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }
    .slots-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .progress-bar-bg { width: 100%; height: 10px; background-color: var(--border-color); border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background-color: var(--accent-blue); transition: width 0.4s ease; }
    
    /* BOTÓN DIRECTO DE STEAM */
    .btn-steam-join {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00adff 0%, #0072ff 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 114, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .btn-steam-join:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
    }
    .btn-steam-join.disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
    }

    /* LISTA DE JUGADORES */
    .players-container { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-top: 6px; }
    .player-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.875rem; }
    .player-avatar { width: 24px; height: 24px; border-radius: 50%; background-color: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #0f172a; }
    .player-empty { font-size: 0.85rem; color: var(--text-muted); font-style: italic; padding: 6px 0; }

    .session-container { display: flex; gap: 10px; margin-top: 6px; }
    .session-input { flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: var(--text-main); font-family: monospace; font-size: 0.9rem; outline: none; }
    .btn-copy { background-color: var(--accent-blue); color: #0f172a; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-value { font-size: 1rem; font-weight: 600; }
    .footer { padding: 14px; background-color: rgba(15, 23, 42, 0.4); border-top: 1px solid var(--border-color); text-align: center; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="header-title">
        <h1 id="server-name">Cargando...</h1>
        <p id="game-name">American Truck Simulator</p>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Verificando</span>
      </div>
    </div>

    <div class="content">
      <!-- Botón de Conexión Directa Steam -->
      <a href="steam://run/270880//+connect%2085568392936670275" id="steam-join-btn" class="btn-steam-join">
        🚛 Unirse al Servidor (Steam)
      </a>

      <!-- Capacidad / Slots -->
      <div class="card">
        <div class="slots-header">
          <span style="color: var(--text-muted);">Jugadores Conectados</span>
          <span id="slots-count">0 / 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="slots-bar"></div>
        </div>
      </div>

      <!-- Lista Visual de Jugadores -->
      <div class="card">
        <div class="card-label">Camioneros en Ruta</div>
        <div class="players-container" id="players-list">
          <div class="player-empty">Cargando lista...</div>
        </div>
      </div>

      <!-- ID de Sesión -->
      <div class="card">
        <div class="card-label">ID de Sesión (Copia manual)</div>
        <div class="session-container">
          <input type="text" class="session-input" id="session-id" value="85568392936670275" readonly>
          <button class="btn-copy" onclick="copySessionId()" id="btn-copy">Copiar</button>
        </div>
      </div>

      <!-- Información Adicional -->
      <div class="grid-2">
        <div class="card">
          <div class="card-label">Versión</div>
          <div class="info-value" id="game-version">-</div>
        </div>
        <div class="card">
          <div class="card-label">Tiempo Activo</div>
          <div class="info-value" id="api-uptime">-</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Actualizado automáticamente cada 10 segundos
    </div>
  </div>

  <script>
    const API_URL = '/api/status';

    function formatUptime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      return `${h}h ${m}m`;
    }

    async function fetchServerStatus() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        // 1. Nombre del Servidor y Juego
        document.getElementById('server-name').innerText = data.serverName || 'ECUASERVER';
        document.getElementById('game-name').innerText = `${data.game} (${data.beta || 'Public'})`;

        // 2. Estado (Online / Offline)
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const joinBtn = document.getElementById('steam-join-btn');
        
        if (data.serverRunning) {
          statusBadge.className = 'status-badge';
          statusText.innerText = 'En Línea';
          joinBtn.className = 'btn-steam-join';
        } else {
          statusBadge.className = 'status-badge offline';
          statusText.innerText = 'Offline';
          joinBtn.className = 'btn-steam-join disabled';
        }

        // 3. Slots y Barra de Progreso
        const connectedCount = data.connectedPlayers ? data.connectedPlayers.length : 0;
        const totalSlots = data.slots || 16;
        const percentage = Math.min((connectedCount / totalSlots) * 100, 100);

        document.getElementById('slots-count').innerText = `${connectedCount} / ${totalSlots}`;
        document.getElementById('slots-bar').style.width = `${percentage}%`;

        // 4. Renderizado de Jugadores Conectados
        const playersListContainer = document.getElementById('players-list');
        playersListContainer.innerHTML = '';

        if (data.connectedPlayers && data.connectedPlayers.length > 0) {
          data.connectedPlayers.forEach(player => {
            const playerName = typeof player === 'string' ? player : (player.name || player.username || 'Camionero');
            const firstLetter = playerName.charAt(0).toUpperCase();

            const playerItem = document.createElement('div');
            playerItem.className = 'player-item';
            playerItem.innerHTML = `
              <div class="player-avatar">${firstLetter}</div>
              <span>${playerName}</span>
            `;
            playersListContainer.appendChild(playerItem);
          });
        } else {
          playersListContainer.innerHTML = '<div class="player-empty">No hay camioneros en ruta actualmente.</div>';
        }

        // 5. Actualización de Session ID y Enlace Deep Link de Steam
        const sessionId = data.sessionID || '85568392936670275';
        document.getElementById('session-id').value = sessionId;
        joinBtn.href = `steam://run/270880//+connect%20${sessionId}`;

        // 6. Detalles adicionales
        document.getElementById('game-version').innerText = data.game_version || '-';
        document.getElementById('api-uptime').innerText = formatUptime(data.apiUptime || 0);

      } catch (error) {
        console.error('Error:', error);
        const statusBadge = document.getElementById('status-badge');
        statusBadge.className = 'status-badge offline';
        document.getElementById('status-text').innerText = 'Sin Conexión';
        document.getElementById('players-list').innerHTML = '<div class="player-empty">Servidor no disponible.</div>';
        
        const joinBtn = document.getElementById('steam-join-btn');
        joinBtn.className = 'btn-steam-join disabled';
      }
    }

    function copySessionId() {
      const input = document.getElementById('session-id');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.innerText = '¡Copiado!';
        setTimeout(() => { btn.innerText = 'Copiar'; }, 2000);
      });
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 10000);
  </script>
</body>
</html>
